# RB 15m Qingpai strict entry profile.
# P6: composite momentum, production execution and point-in-time multi-level replay.

code: RB_MAIN
kl_type: K_15M
data_path: data/processed/RB_15m_continuous_raw.parquet
allow_short: true

chan:
  trigger_step: true
  bi_strict: true
  divergence_rate: .inf
  bsp2_follow_1: false
  bsp3_follow_1: false
  min_zs_cnt: 0
  bs1_peak: false
  macd_algo: full_area
  bs_type: "1,1p,2,2s,3a,3b"
  print_warning: false

grading:
  min_grade: standard

decomposition:
  enabled: true
  level: bi

# P5: every level is replayed independently and joined by first-visible time.
multi_level:
  enabled: true
  parent_kl_type: K_60M
  parent_data_path: data/processed/RB_60m_continuous_raw.parquet
  child_kl_type: K_5M
  child_data_path: data/processed/RB_5m_continuous_raw.parquet
  require_parent_direction: true
  require_confirmed_parent: true
  require_child_confirmation: true
  accepted_child_bsp_types: ["1", "1p", "2"]

momentum:
  enabled: true
  require_t1_confirmation: true
  require_histogram_confirmation: true
  area_ratio_max: 0.90
  area_near_ratio: 1.05
  peak_ratio_max: 0.95
  price_strength_ratio_max: 1.0
  micro_extension_ratio: 0.15
  histogram_shrink_ratio: 0.90

production:
  enabled: true
  adjusted_1m_path: data/processed/RB_1m_continuous_adjusted.parquet
  use_raw_execution_prices: true
  close_on_rollover: true
  reset_structure_on_rollover: true
  warmup_bars: 800

entry:
  policy_id: rb_15m_qingpai_strict_v1
  policy_mode: qingpai_strict
  require_confirmed_bsp: true
  accepted_bsp_types: ["1", "1p", "2", "2s", "3a", "3b"]
  long_only: false

exits:
  - type: StructureStopRule
    priority: 1
    grade_tighten: false
  - type: StructureInvalidationExitRule
    priority: 1
  - type: ChanSmallTurnExitRule
    priority: 5
    amplitude_multiplier: 2.0
    require_fractal_break: true
  - type: OppositeSignalRule
    priority: 1
    mode: flat
    only_high_grade: false
  - type: ChanDivergenceExitRule
    priority: 1
    require_second_level_confirm: false
  - type: TimeStopRule
    priority: 1
    max_bars: 192

risk:
  max_abs_position: 1
  max_loss_points: 600.0
  daily_loss_limit: null
  max_consecutive_losses: 5

sizing:
  method: fixed_fractional
  capital: 100000.0
  risk_pct: 0.01

execution:
  fee_points: 1.0
  slippage_points: 1.0
  contract_multiplier: 10.0
  price_tick: 1.0
  margin_rate: 0.13
  max_margin_utilization: 0.50
